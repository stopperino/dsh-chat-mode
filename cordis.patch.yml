# Chat mode — a conversational agent preset for DeepSeek Harness.
#
# Declares one `@deepseek-ai/dsh-agent-preset` row; the mode picker on the
# new-session screen reads its `id`, `name`, `description` and `order` from the
# preset roster, so the mode appears next to Standard / PTC / Minimal / Creator.
#
# Tools mounted, matching the DeepSeek web chat surface:
#   persona        — chat identity instead of the coding-agent one
#   time-context   — current date/time so "today", "tomorrow" work
#   tool-web       — web_search + web_fetch (the internet-search capability)
#   tool-fs        — read + read_image only: attached files and pictures
#   compaction     — automatic history compression plus the /compact command
#
# Deliberately absent: shell, write/edit, glob/grep, skills, plan mode, goals,
# subagents, workflows. Chat mode answers; it does not operate on a repository.

- insert:
    - id: preset-chat
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: chat
        name: Chat mode
        description: >-
          Обычный разговор с моделью, как на сайте DeepSeek: веб-поиск, картинки
          и файлы, сжатие истории. Без терминала, правки файлов и работы с кодом.
        order: 5
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                You are a helpful, knowledgeable assistant in a chat conversation, powered by the {{model}} model.

                Answer the user's question directly, in the language they write in, and keep the reply focused. Use Markdown when it makes the answer easier to read. When you look something up, cite the URLs you used as Markdown links.

                In this mode you can search the web (web_search), open pages (web_fetch), and read the files and images the user attaches or points to (read, read_image). You cannot change files, run commands, open a terminal, or work on a code repository: if the user needs that, tell them to start the task in Standard mode.

          - id: time-context
            name: '@deepseek-ai/dsh-time-context'

          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000

          - id: read-only-files
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              read: true
              readImage: true
              write: false
              edit: false

          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
